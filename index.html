<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kørselsregnskab</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb300">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kørsel">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--ink:#0a0a0a;--acc:#ffb300;--grey:#ececec;--mid:#6b6b6b;--line:#1a1a1a;--ok:#0b6b2b;--bad:#b00020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:18px}
.content{flex:1;overflow-y:auto;padding:14px 16px 24px}
.panel{display:none}.panel.on{display:block}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:18px;margin:20px 0 8px}
label{display:block;font-weight:700;margin:14px 0 4px}
input,select{width:100%;font-size:22px;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--acc)}
.row{display:flex;gap:10px}.row>*{flex:1}
.veh{display:flex;gap:8px;margin-bottom:6px}
.veh button{flex:1}
#vehRow{margin-bottom:10px}
#vehSel{font-weight:700;background:var(--grey)}
.pbox{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.pbox:focus-within{outline:3px solid var(--acc)}
.pbox input{border:0;outline:0!important;padding:12px 4px;flex:1;min-width:0}
.pbox .suf{font-size:18px;font-weight:700;color:var(--mid);white-space:nowrap}
.sep{border:0;border-top:3px solid var(--ink);margin:26px 0 14px}
button{font-size:20px;font-weight:700;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
button.pri{background:var(--acc);width:100%;margin-top:18px;font-size:22px}
button.sel{background:var(--ink);color:#fff}
button:disabled{opacity:.5}
.kmbox{display:flex;align-items:baseline;border:2px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.kmbox:focus-within{outline:3px solid var(--acc)}
.kmbox .pre{font-size:34px;font-weight:700;color:#b5b5b5;font-variant-numeric:tabular-nums}
.kmbox input{border:0;outline:0!important;font-size:34px;font-weight:700;padding:10px 4px;flex:1;min-width:0;letter-spacing:2px}
.hint{color:var(--mid);margin-top:4px;min-height:22px;font-size:16px}
.box{border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;background:var(--grey)}
.box.big{font-size:22px}
.box .num{font-size:34px;font-weight:800}
.err{display:none;border:2px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px;margin-bottom:10px;font-weight:700}
.warn{color:var(--bad);font-weight:700}
.cards{display:flex;gap:10px}.card{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--grey)}
.card .t{font-size:14px;color:var(--mid)}.card .v{font-size:28px;font-weight:800}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chk label{display:flex;align-items:center;gap:6px;margin:0;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px}
.chk input{width:22px;height:22px;padding:0}
.mc{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mc .ax{flex:none}
.mc .sc{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.mc svg{display:block}
.chk .sw{display:inline-block;width:14px;height:14px;border-radius:3px}
.hint2{color:var(--mid);font-size:14px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 40%;font-size:17px;padding:10px}
.bottom-nav{display:flex;border-top:3px solid var(--ink);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;border:0;border-radius:0;background:#fff;padding:8px 2px 6px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#555}
.bottom-nav button.on{background:var(--acc);color:var(--ink)}
.bottom-nav svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
#setup{position:fixed;inset:0;background:#fff;z-index:50;overflow-y:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
#setup h1{font-size:26px;margin:8px 0 6px}
#setup input{font-size:18px}
</style>
</head>
<body>
<div id="setup" class="hide">
  <h1>Kørselsregnskab</h1>
  <div class="hint" id="setupMsg">Første gang skal appen kende serverens adresse og din nøgle. Du skriver dem kun én gang.</div>
  <label for="setupUrl">Serverens adresse (slutter på /exec)</label>
  <input id="setupUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="setupKey">Nøgle</label>
  <input id="setupKey" type="password" autocomplete="off" autocapitalize="off" placeholder="Nøglen fra Apps Script">
  <button class="pri" id="setupBtn">Gem og start</button>
</div>
<div class="content">
  <div id="err" class="err"></div>
  <div id="vehRow" class="hide"><select id="vehSel" aria-label="Køretøj"></select></div>

  <!-- TANKNING -->
  <div id="panelTankning" class="panel on">
    <h2>Tankning</h2>
    <label for="dato">Dato</label>
    <input type="date" id="dato">
    <label>Km-stand (de tre sidste cifre)</label>
    <div class="kmbox"><span class="pre" id="preT">–</span><input id="kmT" inputmode="numeric" maxlength="3" placeholder="000" autocomplete="off"></div>
    <div class="hint" id="hintT"></div>
    <div class="row">
      <div><label for="liter">Liter</label><input id="liter" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
      <div><label for="pris">Literpris</label><input id="pris" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    </div>
    <label for="sted">Sted</label>
    <input id="sted" list="stedList" placeholder="fx Circle K Odder" autocomplete="off">
    <datalist id="stedList"></datalist>
    <button class="pri" id="gemBtn">Gem tankning</button>
    <div class="box hide" id="resT"></div>
  </div>

  <!-- LADNING (elbil) -->
  <div id="panelLadning" class="panel">
    <h2>Ladning</h2>
    <label for="ldato">Dato</label>
    <input type="date" id="ldato">
    <label>Ladetype</label>
    <div class="veh" id="ltypeRow"></div>
    <label for="lkm">Km-stand (valgfri)</label>
    <div class="pbox"><input id="lkm" inputmode="numeric" placeholder="fx 25400" autocomplete="off"><span class="suf">km</span></div>
    <div class="hint" id="hintL"></div>
    <div class="row">
      <div><label for="lkwh">Ladet</label><div class="pbox"><input id="lkwh" inputmode="decimal" placeholder="0,0" autocomplete="off"><span class="suf">kWh</span></div></div>
      <div><label for="lpris">Pris pr. kWh</label><div class="pbox"><input id="lpris" inputmode="decimal" placeholder="0,00" autocomplete="off"><span class="suf">kr</span></div></div>
    </div>
    <label for="lsamlet">Eller samlet pris</label>
    <div class="pbox"><input id="lsamlet" inputmode="decimal" placeholder="0,00" autocomplete="off"><span class="suf">kr</span></div>
    <div class="hint" id="hintLpris"></div>
    <div class="row">
      <div><label for="lfoer">Batteri før</label><div class="pbox"><input id="lfoer" inputmode="numeric" placeholder="0" autocomplete="off"><span class="suf">%</span></div></div>
      <div><label for="lefter">Batteri efter</label><div class="pbox"><input id="lefter" inputmode="numeric" placeholder="0" autocomplete="off"><span class="suf">%</span></div></div>
    </div>
    <label for="lsted">Sted</label>
    <input id="lsted" list="stedList" placeholder="fx Ionity Hammel" autocomplete="off">
    <button class="pri" id="lgemBtn">Gem ladning</button>
    <div class="box hide" id="resL"></div>
    <h3>Seneste ladninger</h3>
    <div id="lListe"><div class="hint">Henter…</div></div>
  </div>

  <!-- RÆKKEVIDDE -->
  <div id="panelRaekkevidde" class="panel">
    <h2>Rækkevidde</h2>
    <label>Nuværende km-stand (de tre sidste cifre)</label>
    <div class="kmbox"><span class="pre" id="preR">–</span><input id="kmR" inputmode="numeric" maxlength="3" placeholder="000" autocomplete="off"></div>
    <div class="hint" id="hintR"></div>
    <button class="pri" id="raekBtn">Beregn</button>
    <div class="box big hide" id="resR"></div>
  </div>

  <!-- STATISTIK -->
  <div id="panelStatistik" class="panel">
    <h2>Statistik</h2>
    <div id="statBody"><div class="hint">Åbner…</div></div>
  </div>

  <!-- INDSTILLINGER -->
  <div id="panelIndstillinger" class="panel">
    <h2>Køretøjer</h2>
    <div id="vehSetBody"></div>
    <hr class="sep">
    <h2>Dæk</h2>
    <div id="daekBody"><div class="hint">Åbner…</div></div>
  </div>
</div>

<nav class="bottom-nav">
  <button data-tab="Tankning" class="on">
    <svg id="icoTank" viewBox="0 0 24 24"><path d="M4 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"/><path d="M3 20h12"/><path d="M6 8h6v4H6z"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>
    <svg id="icoLad" class="hide" viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>
    <span id="navTankLabel">Tankning</span></button>
  <button data-tab="Raekkevidde"><svg viewBox="0 0 24 24"><path d="M3 17a9 9 0 1 1 18 0"/><path d="M12 17l4-6"/><circle cx="12" cy="17" r="1"/></svg>Rækkevidde</button>
  <button data-tab="Statistik"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M6 15l4-5 3 3 5-7"/></svg>Statistik</button>
  <button data-tab="Indstillinger"><svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>Indstillinger</button>
</nav>

<script>
var state = { veh: null, vehicles: [], allVehicles: [], last: null, lastToken: 0, tab: 'Tankning', stat: null, lad: null,
  checked: { forbrug: true, krKm: false, temperatur: false, literPris: false, kwh: true, kr: false, prisKwh: false } };
var nf1 = new Intl.NumberFormat('da-DK', { maximumFractionDigits: 1 });
var nf2 = new Intl.NumberFormat('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
var nf0 = new Intl.NumberFormat('da-DK', { maximumFractionDigits: 0 });

function el(id) { return document.getElementById(id); }
function h(tag, props, kids) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    if (k === 'text') e.textContent = props[k];
    else if (k === 'class') e.className = props[k];
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
function showError(m) { var b = el('err'); b.textContent = (m && m.message) ? m.message : String(m); b.style.display = 'block'; window.scrollTo(0, 0); el('err').scrollIntoView(); }
function clearError() { el('err').style.display = 'none'; }
// ---------- forbindelse til Apps Script (GET + nøgle) ----------
function getCfg() {
  try {
    var u = localStorage.getItem('kr_api_url'), k = localStorage.getItem('kr_api_key');
    return (u && k) ? { url: u, key: k } : null;
  } catch (e) { return null; }
}
function gemCfg(u, k) {
  try { localStorage.setItem('kr_api_url', u); if (k !== null) localStorage.setItem('kr_api_key', k); return true; } catch (e) { return false; }
}
function sletNoegle() { try { localStorage.removeItem('kr_api_key'); } catch (e) {} }

// Opsætningsskærm. onDone kaldes, når adresse og nøgle er gemt.
function showSetup(besked, onDone) {
  var box = el('setup');
  var cfg = getCfg();
  var u = ''; try { u = localStorage.getItem('kr_api_url') || ''; } catch (e) {}
  el('setupUrl').value = u;
  el('setupKey').value = '';
  el('setupMsg').textContent = besked || 'Første gang skal appen kende serverens adresse og din nøgle. Du skriver dem kun én gang.';
  box.classList.remove('hide');
  el('setupBtn').onclick = function () {
    var nu = el('setupUrl').value.trim(), nk = el('setupKey').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(nu)) { el('setupMsg').textContent = 'Adressen skal starte med https://script.google.com/ og slutte på /exec.'; return; }
    if (!nk) { el('setupMsg').textContent = 'Skriv nøglen.'; return; }
    if (!gemCfg(nu, nk)) { el('setupMsg').textContent = 'Telefonen vil ikke gemme oplysningerne (privat tilstand?).'; return; }
    box.classList.add('hide');
    if (onDone) onDone();
  };
}

function call(fn, args, ok, fail) {
  fail = fail || showError;
  var cfg = getCfg();
  if (!cfg) { showSetup(null, function () { location.reload(); }); return; }
  var url = cfg.url + '?api=1&key=' + encodeURIComponent(cfg.key) + '&fn=' + encodeURIComponent(fn) +
    '&args=' + encodeURIComponent(JSON.stringify(args || []));
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var t = setTimeout(function () { if (ctl) ctl.abort(); }, 60000);
  fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) { return r.json(); }).then(function (j) {
    clearTimeout(t);
    if (j && j.ok) { ok(j.data); return; }
    if (j && j.auth) {
      sletNoegle();
      showSetup((j.error || 'Forkert nøgle.') + ' Skriv nøglen igen.', function () { location.reload(); });
      return;
    }
    fail(new Error((j && j.error) || 'Ukendt fejl fra serveren.'));
  }).catch(function () {
    clearTimeout(t);
    fail(new Error('Ingen forbindelse til serveren. Tjek nettet, eller om adressen er rigtig.'));
  });
}
function localToday() {
  var d = new Date(), m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
}
function num(s) { var t = String(s).replace(',', '.').trim(); return t === '' ? null : parseFloat(t); }
function dkDato(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

// ---------- start ----------
function init() {
  el('dato').value = localToday();
  el('ldato').value = localToday();
  document.querySelectorAll('.bottom-nav button').forEach(function (b) {
    b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
  });
  el('gemBtn').addEventListener('click', gemTankning);
  el('raekBtn').addEventListener('click', beregnRaekkevidde);
  el('lgemBtn').addEventListener('click', gemLadning);
  ['kmT', 'kmR'].forEach(function (id) {
    el(id).addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 3); updKm(); });
  });
  ['lkm', 'lkwh', 'lpris', 'lsamlet'].forEach(function (id) { el(id).addEventListener('input', updLadeHint); });
  el('vehSel').addEventListener('change', function () { setVehicle(this.value); });
  renderLadeType();
  call('getVehicles', [], function (v) {
    state.allVehicles = v;
    state.vehicles = v.filter(function (x) { return x.valgt; });
    if (!state.vehicles.length) { showError('Ingen køretøjer er valgt.'); return; }
    var gemt = hentVeh();
    var kendt = state.vehicles.filter(function (x) { return x.navn === gemt; })[0];
    state.veh = (kendt || state.vehicles[0]).navn;
    renderVehicles();
    applyVehicleUi();
    loadVehicleData();
    loadSteder();
  });
}

function lagreVeh(n) { try { localStorage.setItem('kr_veh', n); } catch (e) {} }
function hentVeh() { try { return localStorage.getItem('kr_veh'); } catch (e) { return null; } }

function vehObj() { return state.allVehicles.filter(function (v) { return v.navn === state.veh; })[0]; }
function erEl() { var v = vehObj(); return !!(v && v.type === 'el'); }

// Menuen øverst: vises kun hvis der er mindst to valgte køretøjer
function renderVehicles() {
  var row = el('vehRow'), sel = el('vehSel'); clear(sel);
  if (state.vehicles.length < 2) { row.classList.add('hide'); return; }
  row.classList.remove('hide');
  state.vehicles.forEach(function (v) {
    var o = h('option', { value: v.navn, text: v.navn });
    if (v.navn === state.veh) o.selected = true;
    sel.appendChild(o);
  });
  sel.value = state.veh;
}

function setVehicle(navn) {
  if (state.veh === navn) return;
  state.veh = navn; lagreVeh(navn);
  clearError();
  el('resT').classList.add('hide'); el('resR').classList.add('hide'); el('resL').classList.add('hide');
  state.last = null; state.lad = null; state.stat = null; state.daek = null;
  updKm();
  renderVehicles();
  applyVehicleUi();
  loadVehicleData();
  reloadTab();
}

// Tilpasser menuen nederst og de faner, der vises, til køretøjets type
function applyVehicleUi() {
  var e = erEl();
  el('navTankLabel').textContent = e ? 'Ladning' : 'Tankning';
  el('icoTank').classList.toggle('hide', e);
  el('icoLad').classList.toggle('hide', !e);
  document.querySelector('.bottom-nav [data-tab=Raekkevidde]').classList.toggle('hide', e);
  if (e && state.tab === 'Raekkevidde') state.tab = 'Tankning';
  showPanel();
}
function panelId(tab) {
  if (tab === 'Tankning') return erEl() ? 'panelLadning' : 'panelTankning';
  return 'panel' + tab;
}
function showPanel() {
  var vis = panelId(state.tab);
  document.querySelectorAll('.bottom-nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === state.tab); });
  document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('on', p.id === vis); });
}
function loadVehicleData() {
  if (erEl()) loadLadning(); else loadLastEntry(false);
}

function loadSteder() {
  call('getSteder', [], function (list) {
    var dl = el('stedList'); clear(dl);
    list.forEach(function (s) { dl.appendChild(h('option', { value: s })); });
  }, function () {});
}

function loadLastEntry(keep) {
  var tok = ++state.lastToken;
  if (!keep) { state.last = null; updKm(); }
  call('getLastEntry', [state.veh], function (r) {
    if (tok !== state.lastToken) return;
    state.last = r.found ? r : null;
    updKm();
  }, function (e) { if (tok === state.lastToken) showError(e); });
}

function switchTab(t) {
  state.tab = t;
  showPanel();
  clearError(); reloadTab();
}
function reloadTab() {
  if (state.tab === 'Statistik') loadStatistik();
  if (state.tab === 'Indstillinger') { renderVehSettings(); loadDaek(); }
}

// ---------- indstillinger: hvilke køretøjer kan vælges ----------
function renderVehSettings() {
  var body = el('vehSetBody'); clear(body);
  body.appendChild(h('div', { class: 'hint', text: 'Sæt kryds ved de køretøjer, der skal kunne vælges i menuen øverst.' }));
  var chk = h('div', { class: 'chk' });
  var bokse = [];
  state.allVehicles.forEach(function (v) {
    var cb = h('input', { type: 'checkbox' });
    cb.checked = !!v.valgt;
    bokse.push({ navn: v.navn, cb: cb });
    cb.addEventListener('change', function () {
      var navne = bokse.filter(function (b) { return b.cb.checked; }).map(function (b) { return b.navn; });
      if (!navne.length) { cb.checked = true; showError('Mindst ét køretøj skal være valgt.'); return; }
      clearError();
      call('setValgteKoeretoejer', [navne], function (alle) {
        state.allVehicles = alle;
        state.vehicles = alle.filter(function (x) { return x.valgt; });
        if (!state.vehicles.some(function (x) { return x.navn === state.veh; })) {
          var ny = state.vehicles[0].navn;
          state.veh = null; renderVehicles(); setVehicle(ny);
        } else { renderVehicles(); }
        renderVehSettings();
      }, function (e) { cb.checked = !cb.checked; showError(e); });
    });
    chk.appendChild(h('label', null, [cb, v.navn]));
  });
  body.appendChild(chk);
  body.appendChild(h('hr', { class: 'sep' }));
  body.appendChild(h('h2', { text: 'Forbindelse' }));
  body.appendChild(h('div', { class: 'hint', text: 'Adresse og nøgle ligger kun på denne telefon.' }));
  body.appendChild(h('button', { text: 'Skift adresse eller nøgle', style: 'width:100%;margin-top:10px', onclick: function () {
    showSetup('Skriv den nye adresse og nøgle.', function () { location.reload(); });
  } }));
}

// ---------- km-felt med rollover ----------
function fuldKm(txt) {
  if (!state.last || txt === '') return null;
  var full = state.last.prefix + parseInt(txt, 10);
  while (full < state.last.km) full += 1000;
  return full;
}
function updKm() {
  [['kmT', 'preT', 'hintT'], ['kmR', 'preR', 'hintR']].forEach(function (ids) {
    var txt = el(ids[0]).value, pre = el(ids[1]), hint = el(ids[2]);
    if (!state.last) { pre.textContent = '–'; hint.textContent = ''; return; }
    var full = fuldKm(txt);
    var p = full === null ? state.last.prefix : Math.floor(full / 1000) * 1000;

  var left = h('div', { class: 'ax' }), right = h('div', { class: 'ax' }), sc = h('div', { class: 'sc' });
  left.style.display = 'flex'; right.style.display = 'flex';
  var L = aktive.filter(function (m) { return m.side === 'L'; }).reverse();   // første kurve nærmest grafen
  var R = aktive.filter(function (m) { return m.side === 'R'; });
  L.forEach(function (m) { left.appendChild(akse(m, true)); });
  R.forEach(function (m) { right.appendChild(akse(m, false)); });

  var svg = sv('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H });
  // vandrette hjælpelinjer fra første aktive akse
  aktive[0].sc.ticks.forEach(function (v) {
    sv('line', { x1: 0, x2: W, y1: aktive[0].Y(v), y2: aktive[0].Y(v), stroke: '#dcdcdc', 'stroke-width': 1 }, svg);
  });
  // månedslinjer og tekst
  var d0 = new Date(t0), y = d0.getUTCFullYear(), mo = d0.getUTCMonth();
  for (var k = 0; k < 400; k++) {
    var tm = Date.UTC(y, mo + k, 1, 12);
    if (tm > t1) break;
    if (tm < t0 - 15 * 86400000) continue;
    var m0 = ((mo + k) % 12 + 12) % 12, jan = m0 === 0, x = X(tm);
    if (x < 0) continue;
    sv('line', { x1: x, x2: x, y1: PT, y2: PT + ph, stroke: jan ? '#8a8a8a' : '#e6e6e6', 'stroke-width': jan ? 1.5 : 1 }, svg);
    var tx = sv('text', { x: x + 3, y: H - 8, fill: jan ? '#0a0a0a' : '#555', 'font-size': 12, 'font-weight': jan ? 700 : 400 }, svg);
    tx.textContent = jan ? String(new Date(tm).getUTCFullYear()) : MAANEDER[m0];
  }
  sv('line', { x1: 0, x2: W, y1: PT + ph, y2: PT + ph, stroke: '#0a0a0a', 'stroke-width': 1.5 }, svg);

  var ender = [];
  aktive.forEach(function (m) {
    var pts = [];
    s[m.key].forEach(function (v, i) { if (v != null && ms[i] !== null) pts.push({ x: X(ms[i]), y: m.Y(v), v: v }); });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join('');
    sv('path', { d: d, fill: 'none', stroke: m.farve, 'stroke-width': 2.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    pts.forEach(function (p) { marker(svg, m.form, p.x, p.y, m.farve); });
    var lp = pts[pts.length - 1];
    ender.push({ x: lp.x + 9, y: lp.y + 4, txt: lp.v.toFixed(m.dec).replace('.', ','), farve: m.farve });
  });
  ender.sort(function (a, b) { return a.y - b.y; });
  for (var q = 1; q < ender.length; q++) if (ender[q].y - ender[q - 1].y < 14) ender[q].y = ender[q - 1].y + 14;
  ender.forEach(function (e) {
    var t = sv('text', { x: e.x, y: e.y, fill: e.farve, 'font-size': 14, 'font-weight': 800 }, svg);
    t.textContent = e.txt;
  });

  sc.appendChild(svg);
  wrap.appendChild(left); wrap.appendChild(sc); wrap.appendChild(right);
  box.appendChild(wrap);
  sc.scrollLeft = sc.scrollWidth;
  box.appendChild(h('div', { class: 'hint2', text: s.type === 'el'
    ? 'Stryg vandret for at se tidligere måneder. Den indeværende måned er ikke afsluttet. Hver kurve har sin egen akse i samme farve.'
    : 'Stryg vandret for at se tidligere tankninger. Hver kurve har sin egen akse i samme farve.' }));
}
window.addEventListener('resize', function () { if (state.tab === 'Statistik') renderCharts(); });

// ---------- dæk ----------
var daekUi = { nyt: false, skift: null };

function loadDaek() {
  var body = el('daekBody'); clear(body); body.appendChild(h('div', { class: 'hint', text: 'Henter…' }));
  var veh = state.veh;
  call('getDaekOversigt', [veh], function (d) { if (veh !== state.veh) return; state.daek = d; renderDaek(); });
}

function renderDaek() {
  var d = state.daek, body = el('daekBody'); clear(body);
  if (!d) return;
  var flere = d.saesoner.length > 1;
  if (flere) {
    body.appendChild(h('div', { class: 'hint', text: 'Aktiv sæson' }));
    var tg = h('div', { class: 'veh' });
    d.saesoner.forEach(function (s) {
      tg.appendChild(h('button', { text: s, class: s === d.aktivSaeson ? 'sel' : '', onclick: function () {
        if (s === d.aktivSaeson) return;
        daekUi.skift = s; renderDaek();
      } }));
    });
    body.appendChild(tg);
    if (d.aktivSiden) body.appendChild(h('div', { class: 'hint', text: 'Siden ' + (d.aktivSiden.dato ? dkDato(d.aktivSiden.dato) + ' · ' : '') + nf0.format(d.aktivSiden.km) + ' km' }));
    if (daekUi.skift) body.appendChild(skiftBox(d));
    var sk = h('div', { class: 'hint' });
    sk.textContent = d.saesoner.map(function (s) { return s + ': ' + nf0.format(d.saesonKm[s] || 0) + ' km'; }).join(' · ');
    body.appendChild(sk);
  }

  if (erEl() && !d.nuKm) {
    body.appendChild(h('div', { class: 'hint warn', text: 'Ingen km-stand registreret for denne bil endnu. Skriv km-standen under Ladning, så kan dækkenes km regnes ud.' }));
  }

  // dæk-tabel
  body.appendChild(h('h3', { text: 'Dæk' }));
  if (!d.daek.length) body.appendChild(h('div', { class: 'hint', text: 'Ingen dæk registreret endnu.' }));
  else {
    var tb = h('table');
    tb.appendChild(h('tr', null, [h('th', { text: 'Hjul' }), h('th', { text: 'Dæk' }), h('th', { text: 'Km' }), h('th', { text: 'Status' })]));
    var order = d.positioner.map(function (p) { return p.kode; });
    d.daek.slice().sort(function (a, b) {
      var ma = a.fjernetKm == null ? 0 : 1, mb = b.fjernetKm == null ? 0 : 1;
      return ma - mb || order.indexOf(a.position) - order.indexOf(b.position) || b.monteretKm - a.monteretKm;
    }).forEach(function (x) {
      var nm = (x.navn || '–') + (flere ? ' (' + x.saeson + ')' : '');
      var st = x.fjernetKm == null ? (flere && x.saeson !== d.aktivSaeson ? 'på lager' : 'monteret') : 'afmonteret ' + dkDato(x.fjernetDato);
      tb.appendChild(h('tr', null, [h('td', { text: x.position }), h('td', { text: nm }), h('td', { text: nf0.format(x.km) }), h('td', { text: st })]));
    });
    body.appendChild(tb);
  }

  // nyt dæk
  if (!daekUi.nyt) {
    body.appendChild(h('button', { class: 'pri', text: 'Nyt dæk', onclick: function () { daekUi.nyt = true; renderDaek(); } }));
  } else body.appendChild(nytBox(d));
}

function skiftBox(d) {
  var dato = h('input', { type: 'date', value: localToday() });
  var km = h('input', { type: 'text', inputmode: 'numeric', value: String(d.nuKm) });
  var ny = daekUi.skift;
  return h('div', { class: 'box' }, [
    h('div', { text: 'Skift til ' + ny, class: 'num' }),
    h('label', { text: 'Dato' }), dato,
    h('label', { text: 'Km-stand' }), km,
    h('button', { class: 'pri', text: 'Bekræft skift', onclick: function (ev) {
      ev.target.disabled = true;
      call('skiftSaeson', [state.veh, dato.value || localToday(), parseInt(km.value, 10), ny], function (r) {
        daekUi.skift = null; state.daek = r; renderDaek();
      }, function (e) { ev.target.disabled = false; showError(e); });
    } }),
    h('button', { text: 'Annuller', style: 'width:100%;margin-top:8px', onclick: function () { daekUi.skift = null; renderDaek(); } })
  ]);
}

function nytBox(d) {
  var valg = { saeson: d.aktivSaeson || d.saesoner[0], pos: {} };
  var box = h('div', { class: 'box' });
  var navn = h('input', { type: 'text', placeholder: 'fx Barum Polaris 5' });
  var dato = h('input', { type: 'date', value: localToday() });
  var km = h('input', { type: 'text', inputmode: 'numeric', value: String(d.nuKm) });
  function draw() {
    clear(box);
    box.appendChild(h('div', { class: 'num', text: 'Nyt dæk' }));
    if (d.saesoner.length > 1) {
      box.appendChild(h('label', { text: 'Sæson' }));
      var r = h('div', { class: 'veh' });
      d.saesoner.forEach(function (s) { r.appendChild(h('button', { text: s, class: s === valg.saeson ? 'sel' : '', onclick: function () { valg.saeson = s; draw(); } })); });
      box.appendChild(r);
    }
    box.appendChild(h('label', { text: 'Hjul' }));
    var chips = h('div', { class: 'chips' });
    d.positioner.forEach(function (p) {
      chips.appendChild(h('button', { text: p.navn, class: valg.pos[p.kode] ? 'sel' : '', onclick: function () { valg.pos[p.kode] = !valg.pos[p.kode]; draw(); } }));
    });
    box.appendChild(chips);
    box.appendChild(h('label', { text: 'Dæktype (valgfri)' })); box.appendChild(navn);
    box.appendChild(h('label', { text: 'Dato' })); box.appendChild(dato);
    box.appendChild(h('label', { text: 'Km-stand' })); box.appendChild(km);
    box.appendChild(h('button', { class: 'pri', text: 'Gem nye dæk', onclick: function (ev) {
      var pos = d.positioner.map(function (p) { return p.kode; }).filter(function (k) { return valg.pos[k]; });
      if (!pos.length) { showError('Vælg mindst ét hjul.'); return; }
      clearError(); ev.target.disabled = true;
      call('nytDaek', [state.veh, valg.saeson, pos, navn.value, dato.value || localToday(), parseInt(km.value, 10)], function (r) {
        daekUi.nyt = false; state.daek = r; renderDaek();
      }, function (e) { ev.target.disabled = false; showError(e); });
    } }));
    box.appendChild(h('button', { text: 'Annuller', style: 'width:100%;margin-top:8px', onclick: function () { daekUi.nyt = false; renderDaek(); } }));
  }
  draw();
  return box;
}

// Service worker: gør appen installerbar og lader skallen åbne uden net
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
if (getCfg()) init(); else showSetup(null, init);
</script>
